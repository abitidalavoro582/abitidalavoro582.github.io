 if(k==='summary'){let rows=Object.entries(S.answers).filter(([_,x])=>!x.skip).map(([key,x])=>(x.items||[]).map((it,i)=>`<div class="sumrow"><b>${i===0?(cfg(key)?.title||key):''}</b><span>${P[it.item]?.[0]||''} · ${it.qty} pezzi${it.color?' · '+it.color:''}</span></div>`).join('')).join('');app.innerHTML=head('RIEPILOGO','La tua fornitura','Controlla le scelte prima di inviare la richiesta.')+`<div class="summary"><div class="sumsec"><h3>${sectors.find(x=>x[0]===S.sector)?.[1]||''}</h3><div class="sumrow"><b>Dipendenti</b><span>${S.employees}</span></div><div class="sumrow"><b>Stagione</b><span>${S.season}</span></div>${rows}<div class="sumrow"><b>Personalizzazione</b><span>${S.personal}${S.personal!=='Nessuna stampa'&&S.logo?' · Logo: '+S.logo:''}</span></div></div></div>`;enable(true);return}
 if(k==='contact'){app.innerHTML=head('ULTIMO STEP','Ricevi una proposta su misura','Inserisci i riferimenti: il riepilogo verrà preparato per WhatsApp.')+`<div class="form"><input id="azienda" placeholder="Nome azienda" value="${S.contact.azienda||''}"><input id="nome" placeholder="Nome e cognome" value="${S.contact.nome||''}"><input id="tel" placeholder="Telefono" value="${S.contact.tel||''}"><textarea id="note" rows="4" placeholder="Note facoltative">${S.contact.note||''}</textarea><button class="bigcta" onclick="sendWA()">INVIA RICHIESTA SU WHATSAPP</button><div class="hint">Nessun ordine viene effettuato automaticamente: la richiesta serve per preparare la proposta.</div></div>`;document.getElementById('next').style.display='none';return}}
function renderProducts(k,app){let c=cfg(k),x=S.answers[k]||{items:[],skip:false};if(!Array.isArray(x.items))x={items:[],skip:false};S.answers[k]=x;let d=S.drafts[k]||{item:'',qty:'',color:''};S.drafts[k]=d;let nc=!!c.colors,ready=d.item&&d.qty&&(!nc||d.color);let rows=x.items.map((it,i)=>`<div class="addedrow"><span><b>${P[it.item][0]}</b> · ${it.qty} pezzi${it.color?' · '+it.color:''}</span><button class="remove" onclick="removeItem('${k}',${i})">RIMUOVI</button></div>`).join('');app.innerHTML=head('CONFIGURAZIONE',c.title,'Puoi inserire più articoli nella stessa categoria, ognuno con quantità e colore propri.')+`<div class="product-layout"><aside class="side"><h4>QUANTITÀ</h4><div class="chips">${qty.map(v=>`<button class="chip ${v==='10+'?'pop':''} ${d.qty===v?'sel':''}" onclick="pickDraft('${k}','qty','${v}')">${v}</button>`).join('')}</div></aside><section><div class="products">${c.items.map(id=>`<div class="product ${d.item===id?'sel':''}" onclick="pickDraft('${k}','item','${id}')"><img src="${A+P[id][1]}"><div class="txt">${P[id][0]}</div></div>`).join('')}</div>${ready?`<button class="addmore" onclick="addItem('${k}')">+ AGGIUNGI QUESTO ARTICOLO</button>`:''}${x.items.length?`<div class="added"><h3>ARTICOLI AGGIUNTI</h3>${rows}<button class="addmore" onclick="resetDraft('${k}')">+ AGGIUNGI UN ALTRO ARTICOLO</button></div>`:''}<div class="skip ${x.skip?'sel':''}" onclick="skip('${k}')">Non serve per questa fornitura</div></section><aside class="side"><h4>${nc?'COLORE':'MODELLO'}</h4>${nc?`<div class="chips">${c.colors.map(v=>`<button class="chip ${d.color===v?'sel':''}" onclick="pickDraft('${k}','color','${v}')">${v}</button>`).join('')}</div>`:'<div style="font-size:12px;color:#66736e">Seleziona il modello al centro. Il colore non è richiesto.</div>'}</aside></div>`;enable(x.skip||x.items.length||ready)}
function pickDraft(k,f,v){let d=S.drafts[k]||{item:'',qty:'',color:''};d[f]=v;S.drafts[k]=d;S.answers[k]=S.answers[k]||{items:[],skip:false};S.answers[k].skip=false;render()}
function addItem(k){let c=cfg(k),d=S.drafts[k],x=S.answers[k];if(!d.item||!d.qty||(c.colors&&!d.color))return;x.items.push({...d});x.skip=false;S.drafts[k]={item:'',qty:'',color:''};render()}
function resetDraft(k){S.drafts[k]={item:'',qty:'',color:''};render()}
function removeItem(k,i){S.answers[k].items.splice(i,1);render()}
function skip(k){S.answers[k]={items:[],skip:true};S.drafts[k]={item:'',qty:'',color:''};render()}
function commitDraft(k){let c=cfg(k),d=S.drafts[k],x=S.answers[k];if(x&&!x.skip&&d&&d.item&&d.qty&&(!c.colors||d.color)){x.items.push({...d});S.drafts[k]={item:'',qty:'',color:''}}}
function enable(v){let n=document.getElementById('next');n.style.display='block';n.disabled=!v}
document.getElementById('next').onclick=()=>{if(!document.getElementById('next').disabled){let k=steps[step];if(['first','second','pants','outer','shoes','dpi'].includes(k))commitDraft(k);step++;render()}};document.getElementById('back').onclick=()=>{if(step){step--;render()}};
function sendWA(){S.contact={azienda:document.getElementById('azienda').value.trim(),nome:document.getElementById('nome').value.trim(),tel:document.getElementById('tel').value.trim(),note:document.getElementById('note').value.trim()};if(!S.contact.azienda||!S.contact.nome){alert('Inserisci almeno nome azienda e referente.');return}let sec=sectors.find(x=>x[0]===S.sector)?.[1]||S.sector;let lines=['Buongiorno, vorrei richiedere una proposta per una fornitura aziendale.','',`Azienda: ${S.contact.azienda}`,`Referente: ${S.contact.nome}`,`Telefono: ${S.contact.tel}`,`Settore: ${sec}`,`Dipendenti: ${S.employees}`,`Stagione: ${S.season}`,''];for(const [k,a] of Object.entries(S.answers)){if(a.skip)continue;let c=cfg(k);for(const it of (a.items||[])){lines.push(`${c?.title||k}: ${P[it.item][0]} · ${it.qty} pezzi${it.color?' · '+it.color:''}`)}}lines.push(`Personalizzazione: ${S.personal}`,`Logo disponibile: ${S.personal==='Nessuna stampa'?'Non necessario':S.logo}`);if(S.contact.note)lines.push(`Note: ${S.contact.note}`);window.open('https://wa.me/393520262607?text='+encodeURIComponent(lines.join('\n')),'_blank')}
render();
</script></body></html>
