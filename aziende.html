<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crea la tua fornitura | Abiti da Lavoro di Alessio Vitale</title>

<style>
:root{
    --verde:#244c3d;
    --verde2:#32624f;
    --verde3:#e9f1ed;
    --oro:#e8b928;
    --testo:#202622;
    --grigio:#66706a;
    --sfondo:#f6f7f5;
    --bianco:#fff;
    --bordo:#e1e6e3;
    --ombra:0 14px 40px rgba(26,50,40,.10);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--testo);
    background:
        radial-gradient(circle at top right,#edf3ef 0,transparent 35%),
        var(--sfondo);
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* HEADER */

header{
    height:76px;
    background:#fff;
    border-bottom:1px solid var(--bordo);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 32px;
    position:sticky;
    top:0;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand img{
    width:48px;
    height:48px;
    object-fit:contain;
}

.brand-text strong{
    display:block;
    color:var(--verde);
    font-size:16px;
}

.brand-text span{
    font-size:12px;
    color:var(--grigio);
}

.home-link{
    text-decoration:none;
    color:var(--verde);
    font-weight:700;
    border:1px solid var(--bordo);
    padding:10px 15px;
    border-radius:12px;
}

/* APP */

.app{
    min-height:calc(100vh - 76px);
    display:flex;
    flex-direction:column;
}

.top-info{
    max-width:1180px;
    width:100%;
    margin:0 auto;
    padding:24px 25px 0;
}

.top-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.small-title{
    color:var(--verde);
    font-size:12px;
    font-weight:800;
    letter-spacing:1.3px;
}

.progress-text{
    font-size:13px;
    color:var(--grigio);
    font-weight:700;
}

.progress{
    height:6px;
    background:#e4e8e5;
    border-radius:20px;
    overflow:hidden;
    margin-top:13px;
}

.progress-bar{
    height:100%;
    width:8%;
    background:linear-gradient(90deg,var(--verde),var(--oro));
    border-radius:20px;
    transition:.4s ease;
}

.breadcrumb{
    margin-top:14px;
    font-size:12px;
    color:#7a837e;
    min-height:16px;
}

/* SCHERMATA */

.screen{
    width:100%;
    max-width:1180px;
    margin:auto;
    padding:35px 25px 110px;
    animation:entra .35s ease;
}

@keyframes entra{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.question{
    text-align:center;
    margin-bottom:30px;
}

.question .step-label{
    color:var(--oro);
    font-size:12px;
    font-weight:900;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.question h1{
    color:var(--verde);
    font-size:clamp(28px,4vw,45px);
    line-height:1.08;
    margin:9px 0 10px;
}

.question p{
    margin:0 auto;
    max-width:720px;
    color:var(--grigio);
    font-size:16px;
    line-height:1.5;
}

/* CARDS */

.options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
    gap:15px;
}

.options.compact{
    max-width:900px;
    margin:auto;
}

.card{
    position:relative;
    border:2px solid transparent;
    background:#fff;
    border-radius:20px;
    min-height:135px;
    padding:20px 16px;
    box-shadow:0 7px 25px rgba(35,58,48,.07);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    transition:.2s ease;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:var(--ombra);
    border-color:#cbd8d1;
}

.card.selected{
    border-color:var(--verde);
    background:#f0f6f3;
    box-shadow:0 8px 30px rgba(36,76,61,.16);
}

.card.selected:after{
    content:"✓";
    position:absolute;
    top:10px;
    right:10px;
    width:27px;
    height:27px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--verde);
    color:#fff;
    font-weight:900;
}

.card .icon{
    font-size:35px;
    margin-bottom:10px;
}

.card .name{
    color:var(--verde);
    font-weight:800;
    font-size:17px;
}

.card .desc{
    color:var(--grigio);
    font-size:12px;
    line-height:1.4;
    margin-top:7px;
}

/* PRODUCT CARD */

.product-card{
    padding:0 0 18px;
    justify-content:flex-start;
}

.product-image{
    width:100%;
    height:300px;
    object-fit:contain;
    background:#fff;
    padding:0;
    border-radius:18px 18px 0 0;
}

.product-card .name{
    padding:3px 10px 0;
}

/* COLORI */

.colors{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:16px;
    max-width:800px;
    margin:auto;
}

.color-card{
    width:105px;
    min-height:115px;
    background:#fff;
    border:2px solid transparent;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-weight:800;
    color:var(--verde);
    box-shadow:0 7px 20px rgba(35,58,48,.07);
}

.color-card.selected{
    border-color:var(--verde);
    background:#f0f6f3;
}

.dot{
    width:45px;
    height:45px;
    border-radius:50%;
    border:1px solid #ccd2ce;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.3);
}

.altro-dot{
    display:grid;
    place-items:center;
    background:#f2f2f2;
    color:#555;
    font-size:23px;
}

/* INFO SCARPE */

.shoe-card{
    min-height:230px;
    justify-content:flex-start;
}

.shoe-card img{
    width:100%;
    height:125px;
    object-fit:contain;
    margin-bottom:5px;
}

.shoe-card .name{
    font-size:20px;
}

.shoe-card .desc{
    font-size:13px;
}

/* CAMBI */

.change-number{
    font-size:34px;
    color:var(--verde);
    font-weight:900;
    margin-bottom:5px;
}

/* NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    min-height:78px;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);
    border-top:1px solid var(--bordo);
    z-index:30;
}

.bottom-inner{
    max-width:1180px;
    min-height:78px;
    margin:auto;
    padding:12px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.nav-btn{
    border:0;
    border-radius:14px;
    padding:14px 22px;
    font-weight:800;
}

.back{
    background:#edf0ee;
    color:var(--verde);
}

.next{
    background:var(--verde);
    color:#fff;
    min-width:150px;
}

.next:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* SUMMARY */

.summary{
    max-width:850px;
    margin:auto;
    background:#fff;
    border-radius:24px;
    box-shadow:var(--ombra);
    overflow:hidden;
}

.summary-head{
    background:var(--verde);
    color:#fff;
    padding:25px;
}

.summary-head h2{
    margin:0 0 5px;
}

.summary-body{
    padding:12px 25px 25px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:14px 0;
    border-bottom:1px solid #edf0ee;
}

.summary-row span:first-child{
    color:var(--grigio);
}

.summary-row strong{
    text-align:right;
    color:var(--verde);
}

.big-cta{
    display:block;
    width:100%;
    border:0;
    background:var(--oro);
    color:#202622;
    font-weight:900;
    padding:18px;
    border-radius:15px;
    margin-top:22px;
}

/* FORM */

.form-box{
    max-width:680px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:24px;
    box-shadow:var(--ombra);
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;
    font-size:13px;
    color:var(--verde);
    font-weight:800;
    margin-bottom:7px;
}

.field input{
    width:100%;
    border:1px solid #d8dedb;
    border-radius:12px;
    padding:14px;
    outline:none;
}

.field input:focus{
    border-color:var(--verde);
}

/* MOBILE */

@media(max-width:700px){

    header{
        height:65px;
        padding:0 14px;
    }

    .brand img{
        width:40px;
        height:40px;
    }

    .brand-text strong{
        font-size:13px;
    }

    .brand-text span{
        display:none;
    }

    .home-link{
        font-size:12px;
        padding:8px 10px;
    }

    .top-info{
        padding:16px 15px 0;
    }

    .screen{
        padding:25px 14px 105px;
    }

    .question{
        margin-bottom:22px;
    }

    .question h1{
        font-size:29px;
    }

    .question p{
        font-size:14px;
    }

    .options{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .card{
        min-height:120px;
        padding:14px 9px;
        border-radius:16px;
    }

    .product-image{
        height:220px;
        padding:0px;
    }

    .product-card .name{
        font-size:14px;
    }

    .card .desc{
        font-size:11px;
    }

    .colors{
        gap:9px;
    }

    .color-card{
        width:92px;
    }

    .bottom-inner{
        padding:10px 14px;
    }

    .nav-btn{
        padding:13px 17px;
    }

    .summary-row{
        display:block;
    }

    .summary-row strong{
        display:block;
        text-align:left;
        margin-top:5px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="logo.webp" alt="Abiti da Lavoro di Alessio Vitale">
        <div class="brand-text">
            <strong>Abiti da Lavoro</strong>
            <span>di Alessio Vitale · Roma</span>
        </div>
    </div>

    <a class="home-link" href="index.html">← Torna al sito</a>
</header>

<div class="app">

    <div class="top-info">
        <div class="top-line">
            <div class="small-title">CREA LA TUA FORNITURA</div>
            <div class="progress-text" id="progressText">Passaggio 1</div>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="breadcrumb" id="breadcrumb"></div>
    </div>

    <main class="screen" id="screen"></main>

</div>

<div class="bottom-nav" id="bottomNav">
    <div class="bottom-inner">
        <button class="nav-btn back" id="backBtn" onclick="goBack()">‹ INDIETRO</button>
        <button class="nav-btn next" id="nextBtn" onclick="goNext()">CONTINUA ›</button>
    </div>
</div>

<script>

/* ===========================
   STATO DEL CONFIGURATORE
=========================== */

const state = {
    persone:"",
    settore:"",
    stagione:"",

    primoStrato:"",
    primoColore:"",
    primoCambi:"",

    secondoStrato:"",
    secondoColore:"",
    secondoCambi:"",

    pantaloneTipo:"",
    pantaloneModello:"",
    pantaloneColore:"",
    pantaloneCambi:"",

    estivoLungoModello:"",
    estivoLungoColore:"",
    estivoLungoCambi:"",
    estivoBermudaModello:"",
    estivoBermudaColore:"",
    estivoBermudaCambi:"",

    esterno:[],
    esternoColore:"",

    giletEstivo:"",
    giletColore:"",

    scarpaClasse:"",
    scarpaAltezza:"",

    stampa:"",
    logo:"",

    dpi:[],

    azienda:"",
    referente:"",
    telefono:"",
    email:""
};

let history = [];
let currentStep = "persone";

/* ===========================
   DATI
=========================== */

const colors = [
    ["Navy","#182a42"],
    ["Nero","#171717"],
    ["Grigio","#777b7c"],
    ["Bianco","#ffffff"],
    ["Rosso","#c9232d"],
    ["Blu Royal","#1766ba"],
    ["Verde","#25704b"],
    ["Sabbia","#cbb995"],
    ["Altro","altro"]
];

const sectors = [
    ["Edilizia","🏗️"],
    ["Logistica / Magazzino","📦"],
    ["Elettricisti","⚡"],
    ["Idraulici","🔧"],
    ["Meccanici / Gommisti","⚙️"],
    ["Tecnici / Manutentori","🛠️"],
    ["Pulizie","✨"],
    ["Giardinaggio","🌿"],
    ["Altro","＋"]
];

/* ===========================
   HELPERS
=========================== */

function setScreen(html){
    const screen = document.getElementById("screen");
    screen.style.animation="none";
    screen.offsetHeight;
    screen.style.animation="entra .35s ease";
    screen.innerHTML=html;
    updateTop();
}

function question(label,title,desc=""){
    return `
    <div class="question">
        <div class="step-label">${label}</div>
        <h1>${title}</h1>
        ${desc ? `<p>${desc}</p>` : ""}
    </div>`;
}

function card(value,title,icon="",desc="",selected=false,img=""){
    return `
    <button class="card ${img ? "product-card":""} ${selected ? "selected":""}"
        onclick="selectCurrent('${escapeJS(value)}')">

        ${img ? `<img class="product-image" src="${img}" alt="${title}">`
              : `<div class="icon">${icon}</div>`}

        <div class="name">${title}</div>
        ${desc ? `<div class="desc">${desc}</div>`:""}
    </button>`;
}

function escapeJS(s){
    return String(s).replace(/'/g,"\\'");
}

function updateTop(){

    const labels = [];

    if(state.persone) labels.push(state.persone+" persone");
    if(state.settore) labels.push(state.settore);
    if(state.stagione) labels.push(state.stagione);

    document.getElementById("breadcrumb").textContent =
        labels.length ? labels.join("  →  ") : "Iniziamo insieme";

    const max = state.stagione==="Estivo" ? 12 : 14;
    const pos = Math.min(history.length+1,max);

    document.getElementById("progressText").textContent =
        "Passaggio "+pos;

    document.getElementById("progressBar").style.width =
        Math.min(100,(pos/max)*100)+"%";
}

function setNext(enabled=true){
    document.getElementById("nextBtn").disabled=!enabled;
}

function pushStep(next){
    history.push(currentStep);
    currentStep=next;
    render();
}

function goBack(){

    if(!history.length){
        window.location.href="index.html";
        return;
    }

    currentStep=history.pop();
    render();
}

function goNext(){

    const routes = {

        persone:"settore",
        settore:"stagione",

        inverno_primo:"inverno_primo_colore",
        inverno_primo_colore:"inverno_primo_cambi",
        inverno_primo_cambi:"inverno_secondo",

        inverno_secondo:"inverno_secondo_colore",
        inverno_secondo_colore:"inverno_secondo_cambi",
        inverno_secondo_cambi:"inverno_pantalone",

        inverno_pantalone:"inverno_pantalone_colore",
        inverno_pantalone_colore:"inverno_pantalone_cambi",
        inverno_pantalone_cambi:"inverno_esterno",

        inverno_esterno:"inverno_esterno_colore",
        inverno_esterno_colore:"scarpa_classe",

        estate_primo:"estate_primo_colore",
        estate_primo_colore:"estate_primo_cambi",
        estate_primo_cambi:"estate_pantalone_tipo",

        estate_pantalone_lungo_modello:"estate_pantalone_lungo_colore",
        estate_pantalone_lungo_colore:"estate_pantalone_lungo_cambi",
        estate_pantalone_lungo_cambi:"estate_gilet",

        estate_bermuda_modello:"estate_bermuda_colore",
        estate_bermuda_colore:"estate_bermuda_cambi",
        estate_bermuda_cambi:"estate_gilet",

        estate_gilet:"estate_gilet_colore",
        estate_gilet_colore:"scarpa_classe",

        scarpa_classe:"scarpa_altezza",
        scarpa_altezza:"stampa",
        stampa:"logo",
        logo:"dpi",
        dpi:"riepilogo"
    };

    if(currentStep==="stagione"){

        if(state.stagione==="Invernale"){
            pushStep("inverno_primo");
        }else{
            pushStep("estate_primo");
        }

        return;
    }

    if(routes[currentStep]){
        pushStep(routes[currentStep]);
    }
}

/* ===========================
   SELEZIONE
=========================== */

function selectCurrent(value){

    const map = {

        persone:"persone",
        settore:"settore",
        stagione:"stagione",

        inverno_primo:"primoStrato",
        inverno_primo_colore:"primoColore",
        inverno_primo_cambi:"primoCambi",

        inverno_secondo:"secondoStrato",
        inverno_secondo_colore:"secondoColore",
        inverno_secondo_cambi:"secondoCambi",

        inverno_pantalone:"pantaloneModello",
        inverno_pantalone_colore:"pantaloneColore",
        inverno_pantalone_cambi:"pantaloneCambi",

        inverno_esterno_colore:"esternoColore",

        estate_primo:"primoStrato",
        estate_primo_colore:"primoColore",
        estate_primo_cambi:"primoCambi",

        estate_pantalone_tipo:"pantaloneTipo",
        estate_pantalone_lungo_modello:"estivoLungoModello",
        estate_pantalone_lungo_colore:"estivoLungoColore",
        estate_pantalone_lungo_cambi:"estivoLungoCambi",
        estate_bermuda_modello:"estivoBermudaModello",
        estate_bermuda_colore:"estivoBermudaColore",
        estate_bermuda_cambi:"estivoBermudaCambi",

        estate_gilet:"giletEstivo",
        estate_gilet_colore:"giletColore",

        scarpa_classe:"scarpaClasse",
        scarpa_altezza:"scarpaAltezza",

        stampa:"stampa",
        logo:"logo"
    };

    if(currentStep==="inverno_esterno"){

        if(value==="Non serve"){
            state.esterno=[];
        }else{
            const i=state.esterno.indexOf(value);

            if(i>=0) state.esterno.splice(i,1);
            else state.esterno.push(value);
        }

        render();
        return;
    }

    if(currentStep==="dpi"){

        if(value==="Non serve"){
            state.dpi=[];
        }else{
            const i=state.dpi.indexOf(value);

            if(i>=0) state.dpi.splice(i,1);
            else state.dpi.push(value);
        }

        render();
        return;
    }

    const key=map[currentStep];

    if(key){
        state[key]=value;
        render();

        /* Piccolo avanzamento automatico nelle scelte iniziali */
        if(["persone","settore","stagione"].includes(currentStep)){
            setTimeout(()=>goNext(),350);
        }
    }
}

/* ===========================
   COLORI
=========================== */

function renderColors(title,key){

    let html=question(
        "SCELTA COLORE",
        title,
        "Scegli il colore che preferisci. Se non è presente, seleziona Altro."
    );

    html+=`<div class="colors">`;

    colors.forEach(([name,color])=>{

        const selected=state[key]===name;

        html+=`
        <button class="color-card ${selected?"selected":""}"
            onclick="selectCurrent('${name}')">

            <div class="dot ${color==="altro"?"altro-dot":""}"
                 style="${color!=="altro" ? `background:${color}`:""}">
                 ${color==="altro" ? "+" : ""}
            </div>

            ${name}
        </button>`;
    });

    html+=`</div>`;

    setScreen(html);
    setNext(!!state[key]);
}

/* ===========================
   CAMBI
=========================== */

function renderCambi(nome,key){

    let html=question(
        "CAMBI PER DIPENDENTE",
        `Quanti ${nome} per ogni persona?`,
        "Il numero di cambi ci aiuta a costruire una proposta più vicina alle vostre esigenze."
    );

    html+=`<div class="options compact">`;

    ["1","2","3","4+"].forEach(n=>{

        html+=`
        <button class="card ${state[key]===n?"selected":""}"
            onclick="selectCurrent('${n}')">
            <div class="change-number">${n}</div>
            <div class="name">${n==="1" ? "capo" : "capi"}</div>
        </button>`;
    });

    html+=`</div>`;

    setScreen(html);
    setNext(!!state[key]);
}

/* ===========================
   RENDER PRINCIPALE
=========================== */

function render(){

    /* PERSONE */

    if(currentStep==="persone"){

        let html=question(
            "INIZIAMO",
            "Quante persone dobbiamo vestire?",
            "Partiamo dalla dimensione della fornitura."
        );

        html+=`<div class="options compact">`;

        ["2+","5+","10+","15+","25+"].forEach(v=>{
            html+=card(
                v,v,
                "👥","",
                state.persone===v
            );
        });

        html+=`</div>`;

        setScreen(html);
        setNext(!!state.persone);
        return;
    }

    /* SETTORE */

    if(currentStep==="settore"){

        let html=question(
            "IL TUO LAVORO",
            "Di cosa si occupa la tua azienda?",
            "Seleziona l'attività principale. Ti guideremo nella composizione della fornitura."

function sendWhatsApp(){

    const azienda=document.getElementById("azienda").value.trim();
    const referente=document.getElementById("referente").value.trim();
    const telefono=document.getElementById("telefono").value.trim();
    const email=document.getElementById("email").value.trim();

    if(!azienda || !referente || !telefono){
        alert("Inserisci almeno azienda, referente e telefono.");
        return;
    }

    let righe=[
        "Buongiorno, vorrei richiedere una proposta per una fornitura aziendale.",
        "",
        "AZIENDA: "+azienda,
        "REFERENTE: "+referente,
        "TELEFONO: "+telefono,
        email ? "EMAIL: "+email : "",
        "",
        "CONFIGURAZIONE:",
        "Persone: "+state.persone,
        "Settore: "+state.settore,
        "Stagione: "+state.stagione
    ];

    if(state.primoStrato && state.primoStrato!=="Non serve"){
        righe.push(
            "Primo strato: "+
            state.primoStrato+" / "+
            state.primoColore+" / "+
            state.primoCambi+" per persona"
        );
    }

    if(state.secondoStrato && state.secondoStrato!=="Non serve"){
        righe.push(
            "Secondo strato: "+
            state.secondoStrato+" / "+
            state.secondoColore+" / "+
            state.secondoCambi+" per persona"
        );
    }

    if(state.stagione==="Invernale" && state.pantaloneModello && state.pantaloneModello!=="Non serve"){
        righe.push(
            "Pantalone: "+
            state.pantaloneModello+" / "+
            state.pantaloneColore+" / "+
            state.pantaloneCambi+" per persona"
        );
    }

    if(state.stagione==="Estivo" && ["Lungo","Entrambi"].includes(state.pantaloneTipo) && state.estivoLungoModello){
        righe.push(
            "Pantalone lungo: "+
            state.estivoLungoModello+" / "+
            state.estivoLungoColore+" / "+
            state.estivoLungoCambi+" per persona"
        );
    }

    if(state.stagione==="Estivo" && ["Bermuda","Entrambi"].includes(state.pantaloneTipo) && state.estivoBermudaModello){
        righe.push(
            "Bermuda: "+
            state.estivoBermudaModello+" / "+
            state.estivoBermudaColore+" / "+
            state.estivoBermudaCambi+" per persona"
        );
    }

    if(state.esterno.length){
        righe.push(
            "Strato esterno: "+
            state.esterno.join(", ")+" / "+
            state.esternoColore
        );
    }

    if(state.giletEstivo==="Sì"){
        righe.push(
            "Gilet multitasche: "+
            state.giletColore+
            " / 1 per persona"
        );
    }

    if(state.scarpaClasse && state.scarpaClasse!=="Non serve"){
        righe.push(
            "Scarpe: "+
            state.scarpaClasse+
            (state.scarpaAltezza ? " / "+state.scarpaAltezza:"")
        );
    }

    righe.push("Personalizzazione: "+state.stampa);

    if(state.stampa!=="Nessuna"){
        righe.push("Logo già disponibile: "+state.logo);
    }

    righe.push(
        "DPI: "+
        (state.dpi.length ? state.dpi.join(", ") : "Nessuno")
    );

    const testo=righe.filter(Boolean).join("\n");

    window.open(
        "https://wa.me/393520262607?text="+encodeURIComponent(testo),
        "_blank"
    );
}
