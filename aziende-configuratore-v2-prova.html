:var(--g)}.cat p{margin:5px 0 0;color:var(--muted);font-size:13px}.badge{background:var(--lg);color:var(--g);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product{overflow:hidden;cursor:pointer}.product img{width:100%;aspect-ratio:1/1;object-fit:contain}.product .txt{padding:12px;text-align:center;font-weight:900;color:var(--g)}.config{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.colors{display:flex;flex-wrap:wrap;gap:8px}.color{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.color.sel{background:var(--g);color:#fff}.add{width:100%;margin-top:16px;background:var(--g);color:#fff;border:0;border-radius:13px;padding:15px;font-weight:900;cursor:pointer}.toolbar{display:flex;gap:10px;justify-content:space-between;margin-bottom:18px}.soft{border:0;background:var(--lg);color:var(--g);padding:11px 14px;border-radius:11px;font-weight:900;cursor:pointer}.cart{margin-top:22px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.remove{border:0;background:#f1f3f2;color:var(--g);border-radius:9px;padding:7px 10px;font-weight:900}.personal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pchoice{padding:18px 10px;border:2px solid var(--line);border-radius:14px;text-align:center;font-weight:900;cursor:pointer}.pchoice.sel{border-color:var(--g);background:var(--lg)}.summary{max-width:850px;margin:auto}.bigcta{width:100%;background:#15945b;color:#fff;border:0;border-radius:14px;padding:16px;font-weight:900;font-size:16px;cursor:pointer}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}.inventory{margin-top:22px;background:#eef7f1;border:1px solid #cfe2d7;border-radius:18px;padding:18px}.inventory h3{margin:0 0 12px;color:var(--g)}.invrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-top:1px solid #dbe9e0}.i  if(view==='special'){app.innerHTML=head('RICHIESTA SPECIALE','Non trovi quello che cerchi?','Descrivi l’articolo e aggiungilo alla tua fornitura.')+`<div class="summary panel"><h3>Articolo richiesto</h3><input id="spname" placeholder="Es. Stivali antinfortunistici con puntale"><br><br><input id="spqty" type="number" min="1" placeholder="Quantità"><br><br><textarea id="spnote" rows="4" placeholder="Note facoltative: taglie, utilizzo, caratteristiche..."></textarea><button class="add" onclick="let n=spname.value.trim(),q=parseInt(spqty.value)||0;if(!n||!q){alert('Inserisci articolo e quantità.');return}S.special.push({name:n,qty:q,note:spnote.value.trim()});view='categories';render()">＋ AGGIUNGI ALLA FORNITURA</button><button class="soft" style="margin-top:12px" onclick="view='categories';render()">← Torna alle categorie</button></div>`;return}
 if(view==='personal'){app.innerHTML=head('4 · PERSONALIZZAZIONE','Vuoi personalizzare gli indumenti?','Scegli una delle opzioni.')+`<div class="personal">${['Lato cuore','Schiena','Cuore + schiena','Nessuna stampa'].map(v=>`<div class="pchoice ${S.personal===v?'sel':''}" onclick="S.personal='${v}';render()">${v}</div>`).join('')}</div>${S.personal&&S.personal!=='Nessuna stampa'?`<div class="panel" style="max-width:650px;margin:18px auto"><h3>Hai già il logo?</h3><div class="season"><button class="choice ${S.logo==='Sì'?'sel':''}" onclick="S.logo='Sì';render()">SÌ, HO IL LOGO</button><button class="choice ${S.logo==='No'?'sel':''}" onclick="S.logo='No';render()">NO, MI SERVE AIUTO</button></div></div>`:''}<button class="cta" onclick="if(!S.personal||(S.personal!=='Nessuna stampa'&&!S.logo)){alert('Completa la scelta di personalizzazione.');return}view='summary';render()">CONTINUA →</button>`;return}
 if(view==='summary'){let rows=cartRows();app.innerHTML=head('5 · RIEPILOGO','La tua fornitura','Controlla gli articoli prima di inserire i dati.')+`<div class="summary"><div class="panel"><h3>${sectors.find(x=>x[0]===S.sector)?.[1]||''} · ${S.season}</h3>${rows}<div class="row"><b>Personalizzazione</b><span>${S.personal}${S.logo?' · Logo: '+S.logo:''}</span></div></div><button class="soft" onclick="view='categories';render()">← Modifica fornitura</button><button class="cta" onclick="view='contact';render()">INSERISCI I DATI →</button></div>`;return}
 if(view==='contact'){app.innerHTML=head('6 · DATI E INVIO','Ricevi una proposta su misura','Inserisci i riferimenti e invia la richiesta su WhatsApp.')+`<div class="summary panel"><input id="azienda" placeholder="Nome azienda" value="${S.contact.azienda||''}"><br><br><input id="nome" placeholder="Nome e cognome" value="${S.contact.nome||''}"><br><br><input id="tel" placeholder="Telefono" value="${S.contact.tel||''}"><br><br><input id="email" placeholder="Email" value="${S.contact.email||''}"><br><br><textarea id="note" rows="4" placeholder="Note facoltative">${S.contact.note||''}</textarea><br><br><button class="bigcta" onclick="sendWA()">INVIA RICHIESTA SU WHATSAPP →</button><div class="hint">Nessun ordine viene effettuato automaticamente: la richiesta serve per preparare la proposta.</div></div>`;return}}
function hasItems(){return Object.values(S.answers).some(x=>(x.items||[]).length)}
function addCurrent(){let c=cfg(activeCat),d=S.drafts[activeCat];let q=totalQty(d);if(!d.item||!q||(c.colors&&!d.color)){alert('Seleziona prodotto, almeno una taglia con quantità'+(c.colors?' e colore.':'.'));return}S.answers[activeCat]=S.answers[activeCat]||{items:[]};let item={item:d.item,color:d.color||'',sizes:{...d.sizes}};if(d.editIndex!==undefined)S.answers[activeCat].items[d.editIndex]=item;else S.answers[activeCat].items.push(item);S.drafts[activeCat]={item:'',color:'',sizes:{}};view='categories';render()}
function removeCurrent(i){S.answers[activeCat].items.splice(i,1);render()}
function cartRows(){return categoryKeys().map(k=>(S.answers[k]?.items||[]).map(it=>`<div class="row"><b>${P[it.item][0]}</b><span>${totalQty(it)} pz${it.color?' · '+it.color:''}<div class="invmeta">${sizeText(it)}</div></span></div>`).join('')).join('')+S.special.map(x=>`<div class="row"><b>Richiesta speciale: ${esc(x.name)}</b><span>${x.qty} pz${x.note?' · '+esc(x.note):''}</span></div>`).join('')}
function sendWA(){S.contact={azienda:azienda.value.trim(),nome:nome.value.trim(),tel:tel.value.trim(),email:email.value.trim(),note:note.value.trim()};if(!S.contact.azienda||!S.contact.nome){alert('Inserisci almeno nome azienda e referente.');return}let sec=sectors.find(x=>x[0]===S.sector)?.[1]||S.sector;let lines=['Buongiorno, vorrei richiedere una proposta per una fornitura aziendale.','',`Azienda: ${S.contact.azienda}`,`Referente: ${S.contact.nome}`,`Telefono: ${S.contact.tel}`,`Email: ${S.contact.email}`,`Settore: ${sec}`,`Dipendenti: ${S.employees}`,`Stagione: ${S.season}`,''];for(const k of categoryKeys())for(const it of (S.answers[k]?.items||[]))lines.push(`${P[it.item][0]} · ${totalQty(it)} pezzi${it.color?' · '+it.color:''} · Taglie: ${sizeText(it)}`);for(const x of S.special)lines.push(`Richiesta speciale: ${x.name} · ${x.qty} pezzi${x.note?' · '+x.note:''}`);lines.push(`Personalizzazione: ${S.personal}`,`Logo disponibile: ${S.personal==='Nessuna stampa'?'Non necessario':S.logo}`);if(S.contact.note)lines.push(`Note: ${S.contact.note}`);window.open('https://wa.me/393520262607?text='+encodeURIComponent(lines.join('\n')),'_blank')}
render();</script></body></html>
